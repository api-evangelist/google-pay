specification: API Commons Plans
specificationVersion: '0.1'
provider: Google Pay
providerId: google-pay
generated: '2026-09-12'
method: searched
source: https://developers.google.com/pay/api/faq
supersedes: >-
  The 2026-05-04 bulk-sweep scaffold that listed free/professional/enterprise tiers with invented
  prices and quotas. Google publishes no such tiers; that file was written by an API Evangelist
  sweep, not harvested, and is replaced here by what Google actually says.
plan_count: 1
model: no-fee
currency: USD
plans:
  - name: Google Pay API
    price: 0
    currency: USD
    billing_period: none
    quota: unmetered
    overage: none
    description: >-
      Google states: "Google Pay doesn't additionally charge users, merchants, and developers
      additional fees to use the Google Pay API for payments." Merchants continue to pay
      processing fees to their own payment processor — those fees are the PSP's pricing, not
      Google's.
    access: >-
      Free to integrate, but production access is gated on human review: a Google Pay Business
      Profile, accepted Terms of Service and Acceptable Use Policy, a registered top-level domain,
      and screenshots approved by the Google Pay team.
    source: https://developers.google.com/pay/api/faq
notes: >-
  There is no pricing page, no metered tier, no self-serve paid plan and no published enterprise
  quote path for the Google Pay API. The commercial relationship is with the payment
  processor/gateway, not with Google. The Google Wallet API is likewise published with no fee
  schedule. Recorded as a single zero-cost plan rather than plan_count 0, because Google makes an
  explicit affirmative statement about cost rather than staying silent.
