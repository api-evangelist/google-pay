method: searched
source: >-
  github.com/google-pay org listing (GitHub API, 2026-09-12) cross-checked against
  registry.npmjs.org, pub.dev, and search.maven.org metadata endpoints
note: >-
  Google Pay ships no server-side REST SDK, because the Google Pay Web and Android APIs are
  client-side JavaScript / Google Play Services surfaces rather than REST APIs. The first-party
  packages are therefore UI/button libraries and platform plugins. Versions and dates below were
  read from each registry's metadata endpoint on 2026-09-12; nothing is inferred from prose.
packages:
