versioning:
  scheme: explicit-major-minor-in-request
  current: apiVersion 2 / apiVersionMinor 0
  description: >-
    The Google Pay client APIs version in the request body, not in a URL path: every
    PaymentDataRequest and IsReadyToPayRequest carries apiVersion and apiVersionMinor. The
    Google Pay UCP payment-handler config schema pins both with JSON Schema const — api_version
    const 2, api_version_minor const 0 — which is the only machine-readable statement of the
    current version Google publishes.
  evidence: json-schema/google-pay-ucp-payment-handler-config.json
  wallet_api_version: v1 (walletobjects), Discovery revision 20260911
