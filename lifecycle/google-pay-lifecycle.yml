  url: https://developers.google.com/pay/api/status
  name: Google Pay API Status Dashboard
  http_status: 200
  checked: '2026-09-12'
deprecation_policy:
  published: false
  sunset_header: false
  deprecation_header: false
  note: >-
    Searched the Google Pay support, release-notes and FAQ trees for a versioning or deprecation
    policy and found none. Google announces changes in dated release notes, but publishes no
    stated deprecation window, no sunset commitment, and returns no RFC 8594 Sunset/Deprecation
    headers on any Google Pay surface. Because no policy is published, no `Deprecation` pointer
    was wired into apis.yml — an absent policy must not be advertised as a present one.
sla:
  published: false
  note: >-
    No public SLA for the Google Pay API. The Google Pay API Terms of Service
    (payments.developers.google.com/terms/sellertos) governs the relationship; it is a terms
    document, not an availability commitment with credits.
deprecated_operations:
  count: 0
  note: No OpenAPI in the repo to derive deprecated operations from.
